<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - CodePractice</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="profile">
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main">
      <h1 class="page-title">👤 Profile</h1>
      <section class="card profile-head">
        <div id="avatar" class="avatar">C</div>
        <div><h2 id="profileName"></h2><p class="muted">Stored only in this browser.</p></div>
      </section>
      <section class="stats">
        <div class="card stat"><span class="num-big" id="pSolved"></span><span class="muted">Problems solved</span></div>
        <div class="card stat"><span class="num-big" id="pAttempts"></span><span class="muted">Total attempts</span></div>
        <div class="card stat"><span class="num-big" id="pBookmarks"></span><span class="muted">Bookmarked</span></div>
        <div class="card stat"><span class="num-big" id="pStreak"></span><span class="muted">Current streak</span></div>
      </section>
      <section class="card"><h3>Progress</h3><pre id="pProgress" class="ascii"></pre></section>
      <section class="card">
        <h3>Display name</h3>
        <form id="nameForm" class="inline-form">
          <input id="nameInput" class="input" maxlength="30" placeholder="Your name">
          <button class="btn primary" type="submit">Save name</button>
        </form>
        <hr><button id="resetBtn" class="btn danger">Reset progress</button>
      </section>
    </main>
  </div>
  <div id="toast"></div>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
